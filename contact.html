  <main>
    <section id="kontak">
      <h2>Hubungi Saya</h2>
      <p>Kirim pesan melalui form berikut:</p>

      <fieldset>
        <legend>Form Kontak</legend>

        <form>
          <label for="nama">Nama Lengkap</label>
          <input id="nama" type="text" required placeholder="Nama Anda">

          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="email@example.com">

          <label for="subjek">Subjek</label>
          <input id="subjek" type="text" required>

          <label for="pesan">Pesan</label>
          <textarea id="pesan" rows="4" required placeholder="Tulis pesan Anda..."></textarea>

          <button type="submit">Kirim Pesan</button>
        </form>
      </fieldset>
    </section>
  </main>
